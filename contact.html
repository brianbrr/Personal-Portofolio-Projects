    <!-- CONTACT -->
    <section class="contact-page">
      <div class="contact-text">
        <h2>Have a Question?</h2>
        <br />
        <p>Fill out your information and admin will reach you out.</p>
        <p>Fill the form below.</p>
      </div>

      <div class="contact-form">
        <form>
          <input
            type="text"
            class="user_data"
            placeholder="Nick Name"
            required
          />
          <input type="email" class="user_data" placeholder="E-Mail" required />
          <textarea
            name="question"
            placeholder="Your Question"
            class="user_data"
            required
          ></textarea>
          <button class="btn">Submit</button>
        </form>
      </div>
    </section>
